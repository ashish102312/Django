<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {%extends 'base.html'%}
    {%block content%}
    {%for student in students%}
    <h1>{{forloop.counter}}.{%if forloop.first%}
        ~
        {%endif%}
        {{student.name}} - {{student.subject}}

        {%empty%}
        <p>No students available.</p>
    </h1>
    {%endfor%}
    {%endblock%}
</body>
</html>
